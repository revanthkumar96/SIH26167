[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26167"
version = "0.1.0"
description = "SatQuery AI — interactive vision-language assistant for multimodal remote sensing image analysis (SIH 2026 / ISRO)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  # Weight downloads are a core server feature, not an optional extra: a fresh
  # machine must be able to fetch a model at startup from a base install.
  "huggingface-hub>=0.30",
]

[project.optional-dependencies]
# Reading GeoTIFF / uint16 rasters. Needed for RSVQA .tif and all operational input.
geo = ["rasterio>=1.3"]
# Correctness-reference backend. CPU-capable but slow.
hf = [
  "torch>=2.4",
  # Qwen2.5-VL's processor imports torchvision eagerly.
  "torchvision>=0.19",
  "transformers>=4.49",
  "accelerate>=1.0",
  # Several vision-language checkpoints ship sentencepiece tokenizers.
  "sentencepiece>=0.2",
  # Used to refuse a CPU load that would not fit in RAM. Optional at runtime:
  # without it the preflight is skipped rather than blocking a valid load.
  "psutil>=5.9",
]
# The backend that actually runs the sweep.
vllm = ["vllm>=0.8"]

[project.scripts]
satquery = "satquery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The web UI ships inside the package; without this a non-editable install
# serves no frontend at all.
"satquery.api" = ["static/*"]

[dependency-groups]
dev = [
  "pre-commit>=4.0.0",
  "ruff>=0.12.0",
  "pytest>=8.0.0",
  # starlette TestClient: current releases prefer httpx2, older ones httpx.
  "httpx>=0.27",
  "httpx2>=2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".git", ".venv", "venv", "data", "models", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"notebooks/**" = ["E402", "F401"]
".cursor/hooks/**" = ["E402", "INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
# Warnings from our own code are errors. The exceptions below are deprecations
# raised inside third-party imports we do not control, and they fire at import
# time, so without them the whole API suite fails to collect.
filterwarnings = [
  "error",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
