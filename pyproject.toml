[project]
name = "sih26167"
version = "0.1.0"
description = "SatQuery AI — interactive vision-language assistant for multimodal remote sensing image analysis (SIH 2026 / ISRO)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Reading GeoTIFF / uint16 rasters. Needed for RSVQA .tif and all operational input.
geo = ["rasterio>=1.3"]
# Correctness-reference backend. CPU-capable but slow.
hf = ["torch>=2.4", "transformers>=4.49", "accelerate>=1.0"]
# The backend that actually runs the sweep.
vllm = ["vllm>=0.8"]

[project.scripts]
satquery = "satquery.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0.0",
  "ruff>=0.12.0",
  "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".git", ".venv", "venv", "data", "models", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"notebooks/**" = ["E402", "F401"]
".cursor/hooks/**" = ["E402", "INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
