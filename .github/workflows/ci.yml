name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        # The suite imports the package, so the project's runtime dependencies
        # must be installed too. Deliberately without the hf/vllm extras: every
        # test runs against the echo backend, so pulling torch would add
        # gigabytes and minutes for no coverage.
        # httpx2 is what current starlette wants for its TestClient; httpx is
        # kept alongside it so older starlette releases still work.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff pytest httpx httpx2

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Pytest
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' -o -name '*_test.py' | wc -l)" -gt 0 ]; then
            python -m pytest
          else
            echo "No tests yet; skipping pytest."
          fi
