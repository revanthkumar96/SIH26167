# VRSBench referring / grounding -- the alternative to captioning.
#
# Two scales matter here and they are independent:
#   box_scale             how the GROUND TRUTH is stored (usually pixels)
#   extra.prediction_box_scale  how the MODEL emits boxes
# The grounding prompt asks for a 0-1000 grid, so `milli` is the default guess;
# set it to `pixel` or `percent` if a candidate ignores the instruction.
name: vrsbench_referring
adapter: vrsbench_referring
task: grounding

root: data/VRSBench
annotations: VRSBench_EVAL_referring.json
image_dir: Images_val
image_suffix: ""

box_format: xyxy     # switch to xywh if validate shows boxes as x,y,w,h
box_scale: pixel

extra:
  image_size: [512, 512]
  prediction_box_scale: milli

fields: {}
#  image_id: image_id
#  question: question
#  bbox: ground_truth

limit: 2000
seed: 1234
